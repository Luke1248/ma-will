name: Deploy static apps to GitHub Pages

# Publishes the standalone PWAs to GitHub Pages:
#   /            -> hsk-flashcards (kept at the root so existing home-screen
#                   icons and bookmarks do not break)
#   /citations/  -> the Bluebook 22 / Virgin Islands citation app
on:
  push:
    branches:
      - main
      - claude/bluebook-virgin-islands-citations-f5sdn7
    paths:
      - "hsk-flashcards/**"
      - "citations/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# Permissions needed for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # NOTE: Pages must be enabled once by hand (Settings -> Pages ->
        # Source: GitHub Actions). The workflow's GITHUB_TOKEN cannot create
        # the Pages site itself, so `enablement: true` is intentionally omitted.
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R hsk-flashcards/. _site/
          mkdir -p _site/citations
          cp -R citations/. _site/citations/
          echo "Published tree:"
          find _site -maxdepth 2 -type d | sort

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
